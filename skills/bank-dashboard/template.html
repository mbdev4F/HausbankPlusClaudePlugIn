<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bankkonten — Hausbank Agent</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --ink: #1a1d23;
      --muted: #5c6570;
      --line: #e2e6eb;
      --accent: #0b3d5c;
      --accent-soft: #e8f0f5;
      --positive: #0d6b4c;
      --negative: #b42318;
      --radius: 10px;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: "Cascadia Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header.hero {
      margin-bottom: 1.75rem;
    }

    header.hero .brand {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 650;
      margin-bottom: 0.35rem;
    }

    header.hero h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    header.hero .meta {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
    }

    .stat .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .stat .value {
      font-size: 1.35rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .stat .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    section {
      margin-bottom: 1.5rem;
    }

    section h2 {
      font-size: 1rem;
      font-weight: 650;
      margin-bottom: 0.75rem;
      color: var(--ink);
    }

    .accounts {
      display: grid;
      gap: 0.75rem;
    }

    .account {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1rem;
      align-items: center;
    }

    .account .name {
      font-weight: 650;
      font-size: 1.05rem;
    }

    .account .iban {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .account .bal {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .account .bal .booked {
      font-size: 1.2rem;
      font-weight: 650;
    }

    .account .bal .avail {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .account .ccy {
      display: inline-block;
      margin-left: 0.35rem;
      font-size: 0.75rem;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.7rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: #f7f8fa;
      font-weight: 600;
    }

    tr:last-child td { border-bottom: none; }

    td.amount {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
      text-align: right;
    }

    .pos { color: var(--positive); }
    .neg { color: var(--negative); }

    td.party {
      max-width: 280px;
    }

    td.party .rem {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .account {
        grid-template-columns: 1fr;
      }
      .account .bal { text-align: left; }
      th:nth-child(2), td:nth-child(2) { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="brand">Hausbank Agent</div>
      <h1>Bankkonten</h1>
      <p class="meta">Stand: <!-- META_DATE --> · Quelle: SME Deutsche Bank Connector</p>
    </header>

    <div class="summary">
      <!-- SUMMARY_CARDS
      Example:
      <div class="stat">
        <div class="label">Konten</div>
        <div class="value">3</div>
      </div>
      <div class="stat">
        <div class="label">Summe (EUR)</div>
        <div class="value">124.580,42 €</div>
        <div class="hint">gebucht</div>
      </div>
      -->
    </div>

    <section>
      <h2>Konten</h2>
      <div class="accounts">
        <!-- ACCOUNT_CARDS
        Example:
        <article class="account">
          <div>
            <div class="name">Geschäftskonto<span class="ccy">EUR</span></div>
            <div class="iban">DE89 3704 0044 0532 0130 00</div>
          </div>
          <div class="bal">
            <div class="booked">45.230,10 €</div>
            <div class="avail">verfügbar: 45.230,10 €</div>
          </div>
        </article>
        -->
      </div>
    </section>

    <section>
      <h2>Letzte Umsätze</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Konto</th>
              <th>Gegenpartei / Verwendungszweck</th>
              <th style="text-align:right">Betrag</th>
            </tr>
          </thead>
          <tbody>
            <!-- TX_ROWS
            Example:
            <tr>
              <td>06.03.2026</td>
              <td>Geschäftskonto</td>
              <td class="party">
                Muster GmbH
                <span class="rem">Rechnung 2026-041</span>
              </td>
              <td class="amount neg">−1.250,00 €</td>
            </tr>
            <tr>
              <td>05.03.2026</td>
              <td>Geschäftskonto</td>
              <td class="party">Kunde AG<span class="rem">Zahlung</span></td>
              <td class="amount pos">+3.800,00 €</td>
            </tr>
            -->
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      Nur Lesen · Keine erfundenen Salden · Beträge aus Live-Daten befüllt
    </footer>
  </div>
</body>
</html>
